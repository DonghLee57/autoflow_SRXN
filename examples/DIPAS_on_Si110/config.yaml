# =============================================================================
# Practical Config: Ethanol (Physi) + DIPAS (Physi/Chemi) on Si(110)
# =============================================================================

paths:
  substrate_bulk: "../../structures/Si_mp149.vasp"
  precursor:      "../../structures/DIPAS.vasp"
  inhibitor:      "../../structures/ethanol.vasp"
  include_no_inhibitor: true
  output_prefix:  "results"
  restart: true

# =============================================================================
# Pipeline Control — what to compute (all flags in one place)
# =============================================================================
workflow:
  slab_relax:       false  # Geometry-optimize bare slab before candidate search
  candidate_relax:  false   # Geometry-optimize each candidate after generation
  md_equilibrate:   false  # NVT-MD equilibration after candidate_relax
  post_md_relax:    false   # Re-optimize after MD (only if md_equilibrate: true)

# =============================================================================
# Relaxation parameters — shared by all relax/MD stages
# =============================================================================
relaxation:
  fmax:         0.05    # Force convergence (eV/Å)
  steps:        100     # Max optimizer steps
  frozen_z_ang: 5.5     # Fix atoms below z_min + this height (Å) during all relax/MD

equilibration:
  temperature_K: 300
  md_steps:      1000
  timestep_fs:   1.0
  damping:       100.0

# =============================================================================
# Surface Preparation
# =============================================================================
surface_prep:
  slab_generation:
    enabled:           true
    miller:            [1, 1, 0]
    thickness_ang:     12.0
    vacuum_ang:        15.0
    target_area_ang2:  250.0

  passivation:
    enabled: true
    element: "H"
    side:    "bottom"

# =============================================================================
# Reaction Search
# =============================================================================
reaction_search:
  symprec: 0.2
  mechanisms:
    inhibitor:
      enabled: true
      center:  "O"
      physisorption:
        enabled:          true
        placement_height: 3.2
        height_mode:      "clearance"
        gravity_pull:
          enabled: true
      chemisorption:
        enabled: false
      branching_limit: 1

    precursor:
      center: "Si"
      physisorption:
        enabled:          true
        placement_height: 5.0
        height_mode:      "clearance"
        n_rot:            8
        gravity_pull:
          enabled:   true
          step_size: 0.2
      chemisorption:
        enabled:  true
        rot_steps: 8
        proximity_filter:
          enabled:   true
          cutoff:    7.0
          visualize: true

  candidate_filter:
    overlap_scale: 0.65

# =============================================================================
# Simulation Engine
# =============================================================================
engine:
  potential:
    backend: "mace"
    model:   "medium"
    device:  "cpu"
    dtype:   "float64"
    d3:      false
