# Mode-following relaxation — End-to-End Slab Workflow
# ---------------------------------------------------
# Standardized to config_full.yaml hierarchy.

workflow:
  slab_relax:       true

surface_prep:
  slab_generation:
    enabled:            true
    miller:             [0, 0, 1]
    thickness_ang:      15.0
    vacuum_ang:         15.0
    target_area_ang2:   100.0

paths:
  input_structure:  "../../../structures/SiO2_mp-546794.vasp"
  center_in_vacuum: false
  output_prefix:    "results/slab"

engine:
  potential:
    backend: "mace"
    model:   null
    device:  "cpu"
    dtype:   "float64"

relaxation:
  optimizer: "FIRE"
  fmax:      0.01
  steps:     300

analysis:
  vibrational:
    name:             "results/vib"
    displacement_ang: 0.01
    phva:
      enabled:      true
      frozen_z_ang: 5.5

    mode_refinement:
      enabled:            true
      max_iter:           2
      fmax:               0.01
      steps:              300
      freq_threshold_thz: -0.5
      max_modes:          3
      perturbation_alpha: 0.2
      max_displacement:   0.5

    visualization:
      enabled:     true
      n_frames:    10
      output_traj: "results/relaxation.extxyz"
