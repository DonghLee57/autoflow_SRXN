# =============================================================================
# Interface Lattice-Match Example: TiN substrate / HfO2 t-phase film
# =============================================================================
# Optimized to find coincidence lattices between TiN (FCC) and HfO2 (Tetragonal).
# =============================================================================

# ── Input bulk crystal files ─────────────────────────────────────────────────
sub_path:  "../../../structures/TiN_bulk.vasp"       # Substrate bulk crystal
film_path: "../../../structures/HfO2_t_bulk.vasp"   # Film bulk crystal (Tetragonal)

# ── Surface orientations to search ───────────────────────────────────────────
# Using symmetrically distinct Miller indices up to index 2
sub_max_miller: 2
film_max_miller: 2
miller_mode: "distinct"

# ── ZSL lattice-match parameters ─────────────────────────────────────────────
# max_det: 20 is sufficient for most t-phase matches.
max_det: 20

# strain_cutoff: 0.12 (12%)
strain_cutoff: 0.12

# max_atoms: 800
max_atoms: 800

# ── Slab construction ─────────────────────────────────────────────────────────
min_slab_thickness: 10.0
vacuum: 15.0

# ── Slab stacking ─────────────────────────────────────────────────────────────
interface_gap: 2.5

# ── Output ───────────────────────────────────────────────────────────────────
build_top_k: 5
output_dir: "results"
