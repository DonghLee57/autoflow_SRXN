paths:
  input_structure: "dipas_sio2_relaxed.vasp"

engine:
  potential:
    backend: "mace"
    model:   "medium"
    device:  "cpu"
    dtype:   "float64"

analysis:
  vibrational:
    name:             "results/phva"
    cache_format:     "lammps_dump"
    save_cache:       true
    displacement_ang: 0.01
    phva:
      enabled:      true
      use_selective_dynamics: false
      frozen_z_ang: 5.5          # Freeze bottom 5.5 Å (~99 atoms frozen)
