# =============================================================================
# TiN(111) + TiCl4 (SevenNet-omni, matpes_pbe modal)
# Adsorption energy comparison vs 7net-0 (config_no_relax.yaml).
#
# matpes_pbe is ~8.6× slower than 7net-0 on CPU.
# This config uses reduced n_rot/steps to keep the run feasible.
#
# Mechanisms:
#   - physisorption       : molecular adsorption (TiCl4 intact)
#   - single-site chem.   : TiCl3 binds to one N dangling bond, Cl released
#   - dissociative chem.  : TiCl3 on N1, Cl on N2 (paired dangling bonds)
# =============================================================================

paths:
  substrate_bulk: "../../../structures/TiN_bulk.vasp"
  precursor:      "../../../structures/TiCl4.vasp"
  output_prefix:  "results_matpes_pbe"

surface_prep:
  slab_generation:
    enabled:          true
    miller:           [1, 1, 1]
    thickness_ang:    12.0
    vacuum_ang:       15.0
    supercell_matrix: [[2, 0], [0, 2]]
  surface_analysis:
    ideal_coordination:
      Ti: 6
      N:  6
  passivation:
    enabled: false

reaction_search:
  symprec: 1.0
  mechanisms:
    precursor:
      center: "Ti"
      physisorption:
        enabled:          true
        placement_height: 3.5
        n_rot:            4          # Reduced from 8 → 4 for speed (8.6× slower)
        gravity_pull:
          enabled: true
      chemisorption:
        enabled:          true
        verbose:          true
        # single-site (TiCl3 → N, Cl released) and dissociative (TiCl3+Cl on N-N pair)
        # are both active by default when surface dangling bonds are found.
      ts_search:
        enabled: false               # TS search skipped; focus on adsorption energetics
  candidate_filter:
    overlap_scale: 0.65
    max_pair_dist: 5.0

workflow:
  slab_relax:       true            # Relax TiN slab with matpes_pbe
  candidate_relax:  true            # Relax each candidate (physi + chem)
  md_equilibrate:   false
  post_md_relax:    false

relaxation:
  fmax:             0.05            # Slightly looser than 7net-0 run (0.03)
  steps:            150             # Reduced from 200 for speed
  frozen_z_ang:     6.0

engine:
  potential:
    backend:   "sevennet"
    model:     "7net-omni"
    modal:     "matpes_pbe"         # PBE-level head of 7net-omni
    device:    "cpu"
