# =============================================================================
# AutoFlow-SRXN — Full Configuration Reference
# =============================================================================
# Package purpose:
#   Automated surface reaction pathway explorer for ALD/CVD chemistry.
#   Given a substrate crystal and a precursor molecule, it generates and
#   evaluates all plausible adsorption structures (physisorption, dissociative
#   chemisorption, protector-ligand exchange) through three sequential stages:
#
#   Stage 1 · surface_prep    — build, passivate, and equilibrate the slab
#   Stage 2 · reaction_search — generate and rank adsorption candidates
#   Stage 3 · analysis        — vibrational stability + thermochemical free energies
#
# Potential dependency:
#   Not all sub-steps require an ML potential. Sections that do are marked
#   with [REQUIRES POTENTIAL]. Unmarked sections run on geometry alone,
#   so stages 1 and 2 can be executed without configuring `engine` at all.
# =============================================================================


# -----------------------------------------------------------------------------
# I/O — single source of truth for all file references
# -----------------------------------------------------------------------------
paths:
  # ── Substrate Definitions ─────────────────────────────────────────────────
  substrate_bulk:  "structures/SiO2_mp-546794.vasp"  # Bulk crystal (VASP).
  input_structure: null                              # Pre-built slab (skips generation).

  # ── Precursor & Inhibitor (Supports Single Files & Directories) ───────────
  # AutoFlow-SRXN supports automated large-scale screening by scanning 
  # directories for molecular structures.
  #
  # 1. Unified Interface: Set 'precursor' and 'inhibitor' paths.
  #    - If a path points to a file, it runs a single target calculation.
  #    - If a path points to a directory, it automatically scans all .vasp, 
  #      .xyz, and .extxyz files within it for batch screening.
  # 2. Cross-Product Pairing: If one or both are directories, the tool 
  #    performs discovery for ALL possible combinations (Precursor X Inhibitor).
  # 3. Directory Organization: Each pair gets its own output folder named 
  #    '{inhibitor}_on_{precursor}' inside the global output directory.
  # 4. Baseline Comparison: Set 'include_no_inhibitor: true' to automatically 
  #    include a 'Pure Surface' (no inhibitor) case for each precursor.

  precursor:       "structures/DIPAS.vasp"   # Single file OR directory of precursors.
  inhibitor:       null                      # Single file, directory of inhibitors, or null.
  include_no_inhibitor: true                 # Include 'None_on_Precursor' baseline.

  # ── Output Management ─────────────────────────────────────────────────────
  output_dir:      "results"            # Base folder for batch results.
  output_prefix:   "discovery"          # Prefix for inner result files.


# -----------------------------------------------------------------------------
# Global Workflow Control
# -----------------------------------------------------------------------------
# Set to 'true' to force re-calculation even if results exist in the directory.
# If 'false', the workflow skips pairs that already have 'results_final_verified.extxyz'.
restart: false


# -----------------------------------------------------------------------------
# Pipeline Control — what to compute (all stage enable-flags in one place)
# -----------------------------------------------------------------------------
# Each flag controls one step of the pipeline.  Potential-requiring steps
# (slab_relax, candidate_relax, md_equilibrate) are marked [REQUIRES POTENTIAL].
# Disabling ALL three keeps the workflow purely geometric (no MLIP needed).
#
#   slab_relax       [REQUIRES POTENTIAL]
#     Geometry-optimize the bare substrate slab ONCE before any candidate search.
#     Use when the as-cut slab is far from equilibrium (large forces).
#     Skip for pre-relaxed structures or fast screening runs.
#
#   candidate_relax  [REQUIRES POTENTIAL]
#     Geometry-optimize every candidate structure after placement.
#     This is the primary quality gate: structures that blow up are discarded.
#     Disabling it gives raw geometric candidates with no energy information.
#
#   md_equilibrate   [REQUIRES POTENTIAL]
#     NVT-MD run after candidate_relax to escape local minima and assess
#     thermal stability.  Parameters come from the `equilibration` block below.
#
#   post_md_relax    [REQUIRES POTENTIAL]
#     Short re-optimization after MD to snap to the nearest local minimum.
#     Only meaningful when md_equilibrate: true.
#
workflow:
  slab_relax:       false   # [REQUIRES POTENTIAL] Relax bare slab before search
  candidate_relax:  true    # [REQUIRES POTENTIAL] Relax each candidate after placement
  md_equilibrate:   false   # [REQUIRES POTENTIAL] NVT-MD equilibration after relax
  post_md_relax:    true    #                      Re-relax after MD (needs md_equilibrate: true)


# -----------------------------------------------------------------------------
# Relaxation parameters — shared by ALL relax stages (slab + candidates)
# -----------------------------------------------------------------------------
# These values are used by slab_relax, candidate_relax, and post_md_relax.
# Override individual stages through surface_prep.slab_relaxation.* if needed.
#
relaxation:
  fmax:             0.05    # Force convergence criterion (eV/Å)
  steps:            200     # Max optimization steps per call
  optimizer:        "BFGS"  # "BFGS", "LBFGS", "LBFGSLineSearch", or "FIRE"
  frozen_z_ang:     null    # Fix atoms below z_min + this value (Å); null → no constraint

# -----------------------------------------------------------------------------
# MD equilibration parameters — used when workflow.md_equilibrate: true
# -----------------------------------------------------------------------------
equilibration:
  temperature_K:    500     # Thermostat temperature (K)
  md_steps:         2000    # Integration steps
  timestep_fs:      1.0     # Timestep (fs)
  damping:          100.0   # Langevin friction timescale (fs)
  frozen_z_ang:     null    # Fix bottom slab layers during MD (Å); null → no constraint

# -----------------------------------------------------------------------------
# Potential & Simulation Engine Settings
# -----------------------------------------------------------------------------
engine:

  potential:
    # ── Backend ────────────────────────────────────────────────────────────────
    # Choice of machine learning interatomic potential (ML-IAP) backend.
    #
    # "mace"
    #   MACE-MP equivariant message-passing network.  Trained on the Materials
    #   Project trajectory database (89 elements).  Strong general-purpose
    #   baseline for crystalline materials, surfaces, and small molecules.
    #   Internally uses mace.calculators.mace_mp().
    #
    # "sevennet"
    #   SevenNet (7Net) E(3)-equivariant GNN.  Particularly robust for complex
    #   surface environments and catalysis workflows.  Driven via
    #   sevenn.calculator.SevenNetCalculator / SevenNetD3Calculator.
    #   Requires the 'sevenn' package: pip install sevenn.
    #
    # "emt"
    #   Effective Medium Theory — built directly into ASE.  No external
    #   package needed, sub-millisecond evaluation.  Only parameterised for
    #   simple metals (Cu, Ag, Au, Ni, Pd, Pt, Al, C, N, O, H).
    #   Use exclusively for quick workflow smoke-tests.
    backend:  "mace"

    # ── Hardware ───────────────────────────────────────────────────────────────
    # PyTorch compute device.
    # "cpu"  — always available; slower for large systems (> ~200 atoms).
    # "cuda" — requires an NVIDIA GPU + matching CUDA toolkit; strongly
    #           recommended for production runs or MD > 10 000 steps.
    device:   "cpu"

    # ── Model checkpoint ───────────────────────────────────────────────────────
    # Selects which pretrained weights to load.
    #
    # MACE options
    #   null              -> "medium-mpa-0" (Materials Project + Alexandria; default)
    #   "small"           -> lighter model, faster but slightly less accurate
    #   "medium"          -> original MACE-MP-0 medium (mace_mp_0)
    #   "large"           -> original MACE-MP-0 large
    #   "medium-0b3"      -> MACE-MP-0b3, improved coverage of organic chemistry
    #   "/path/model.pt"  -> local checkpoint; must be a MACE-compatible .model file
    #
    # SevenNet options
    #   null              -> "7net-0" (universal potential for 89 elements)
    #   "7net-omat24"     -> fine-tuned on Open Materials 2024 dataset
    #   "/path/ckpt.pth"  -> local SevenNet checkpoint (.pth)
    model:    null

    # ── Floating-point precision ───────────────────────────────────────────────
    # SINGLE control for compute precision. Applied globally via
    # torch.set_default_dtype AND passed to the backend, so it now governs both
    # MACE and SevenNet (and any torch-backed step) from one option.
    #
    # "float32"  Faster (≈2× on CPU, ≈4× on GPU), lower memory.
    #            Sufficient for NVT-MD, metadynamics and coarse geometry screening.
    #            Typical force error vs float64: < 1 meV/A.
    #
    # "float64"  Double precision.  Required when:
    #            • Geometry optimisation to tight fmax (< 0.05 eV/A)
    #            • Hessian / vibrational-frequency calculations
    #            • Thermodynamic free-energy comparisons (PHVA / FHVA)
    #            Numerical second derivatives amplify any single-precision noise.
    #
    # Note: when device is "cuda", TF32 fast-math (matmul/cudnn allow_tf32) is
    # enabled automatically for an additional float32 speed-up on Ampere+ GPUs.
    dtype:    "float64"

    # ── D3 dispersion correction ───────────────────────────────────────────────
    # Adds Grimme's D3(BJ) empirical van der Waals correction to the potential.
    # Improves description of physisorption and π-π stacking interactions
    # that are under-bound by most GGA-based MLIP training sets.
    #
    # MACE    — uses TorchDFTD3Calculator (pip install torch-dftd).
    # SevenNet — uses SevenNetD3Calculator (bundled in sevenn ≥ 0.9).
    # EMT     — not supported; setting has no effect.
    #
    # When to enable:
    #   Physisorption binding energies, weakly-bound molecular precursors,
    #   or any system where vdW interactions contribute > 0.1 eV.
    d3:       false

    # ── SevenNet-specific options ──────────────────────────────────────────────
    # modal
    #   Selects the fidelity head for multi-head SevenNet models.
    #   Required for models such as 7net-omat24 (modal: "omat24") or
    #   multi-property Alexandra models.  Leave null for standard 7net-0.
    modal:    null

    # enable_cueq
    #   Activates the cuEquivariance CUDA kernel for equivariant tensor
    #   contractions.  Provides 2-5× speedup on NVIDIA GPUs.
    #   Requires: pip install cuequivariance cuequivariance-torch
    #   Has no effect on CPU or with EMT / MACE backends.
    enable_cueq:  false

    # enable_flash
    #   Enables FlashAttention-2 for the attention layers present in some
    #   SevenNet architectures.  Reduces GPU memory footprint by ~30 % and
    #   improves throughput for long-range interaction models.
    #   Requires: pip install flash-attn  (CUDA 11.8+ only)
    enable_flash: false

    # ── ZBL short-range repulsion ──────────────────────────────────────────────
    # Layered Ziegler-Biersack-Littmark (ZBL) screened-Coulomb repulsion.
    #
    # Background
    # ----------
    # ML potentials are trained on near-equilibrium structures.  At very short
    # interatomic distances (sub-bonding, r < ~1.5 A) encountered during
    # aggressive MD or geometry searches, the MLIP energy surface can be
    # unphysical — sometimes even attractive — because no such configurations
    # appeared in the training data.  The ZBL potential provides the correct
    # nuclear repulsion in this regime and prevents catastrophic geometry
    # explosions.
    #
    # Implementation
    # --------------
    # When enabled, the engine builds
    #   SumCalculator([<MLIP calculator>, ZBLCalculator(...)])
    # using ASE's mixing module.  Energies and forces are summed independently,
    # so gradients remain exact.  The ZBL contribution is non-zero only inside
    # cutoff_outer, so it adds negligible overhead for well-prepared structures.
    #
    # Physics
    # -------
    # Pair energy:
    #   V_ZBL(r) = (Z_i · Z_j · e2) / (4πε₀ · r) · Φ(r / a_ij)
    #
    # Universal screening length:
    #   a_ij = 0.4685 A / (Z_i^0.23 + Z_j^0.23)
    #
    # Universal screening function (4-term fit, ZBL 1985):
    #   Φ(x) = 0.1818·e^(−3.200·x) + 0.5099·e^(−0.9423·x)
    #         + 0.2802·e^(−0.4029·x) + 0.02817·e^(−0.2016·x)
    #
    # Switching function (cubic Hermite, C¹-smooth):
    #   S(r) = 1                              r ≤ cutoff_inner
    #   S(r) = 1 − 3t2 + 2t³  (t normalised) cutoff_inner < r < cutoff_outer
    #   S(r) = 0                              r ≥ cutoff_outer
    # Forces are derived analytically from dV/dr · S(r) + V · dS/dr.
    #
    # Supported backend combinations
    # --------------------------------
    #   backend: "mace"     + zbl.enabled: true   ->  MACE-MP  + ZBL
    #   backend: "sevennet" + zbl.enabled: true   ->  SevenNet + ZBL
    #   backend: "mace", d3: true, zbl.enabled: true  ->  MACE + D3 + ZBL
    #   backend: "emt"      + zbl.enabled: true   ->  EMT + ZBL (testing only)
    #
    # Per-pair outer cutoff database
    # --------------------------------
    # src/zbl_pairs.json stores element-pair-specific outer switching distances
    # for 14 chemically relevant elements (Al, C, Cl, Cu, Fe, H, Hf, N, O, P,
    # S, Si, Ti, Zr).  Each value is set to approximately the equilibrium bond
    # length (R_cov_i + R_cov_j × 1.056, capped at 0.8-2.8 A) so that ZBL is
    # essentially inactive at normal bonding distances and only activates at
    # sub-bonding close contacts.  Element pairs not listed in the file fall
    # back to the global cutoff_outer parameter defined below.
    #
    # Cutoff guidelines for surface chemistry
    # -----------------------------------------
    #   Reference bond lengths:  Si-Si 2.35 A · Si-O 1.64 A · C-H 1.09 A
    #                            N-H  1.01 A · Si-N 1.73 A · Si-H 1.48 A
    #
    #   cutoff_inner: 0.5 A  — well below any covalent bond; ZBL is fully
    #                           active only at extreme nuclear overlap.
    #                           Short bonds (N-H 1.01 A, O-H 0.96 A) sit near
    #                           the outer switching end where S ≈ 0, so ZBL
    #                           does not perturb equilibrium geometries.
    #   cutoff_outer: 2.5 A  — global fallback for pairs absent from the DB.
    #                           Per-pair values in src/zbl_pairs.json typically
    #                           range from 0.8 A (H-H) to 2.8 A (heavy metals),
    #                           keeping ZBL inactive at normal bonded distances.
    zbl:
      enabled:       false   # false -> pure MLIP  |  true -> MLIP + ZBL combination
      cutoff_inner:  0.5     # A. ZBL weight = 1 (fully active)  for r ≤ cutoff_inner.
      cutoff_outer:  2.5     # A. Global fallback outer cutoff for pairs not found in
                             #    src/zbl_pairs.json.  ZBL weight = 0 for r ≥ this value.
                             #    Weight transitions smoothly via cubic Hermite between
                             #    cutoff_inner and the pair-specific (or fallback) outer
                             #    cutoff — forces are continuous everywhere.




# -----------------------------------------------------------------------------
# Stage 0a — Heterointerface Slab Generation
# -----------------------------------------------------------------------------
# Note: Interface generation (Stage 0a) is only supported in the 'dev' branch.
#



# -----------------------------------------------------------------------------
# Stage 1 — Surface Preparation
# -----------------------------------------------------------------------------
surface_prep:

  # ── Geometry-only ──────────────────────────────────────────────────────────

  slab_generation:
    enabled:            true          # false -> load slab directly from paths.input_structure
    miller:             [0, 0, 1]     # Miller indices [h, k, l]
    thickness_ang:      15.0          # Slab thickness (A)
    vacuum_ang:         15.0          # Vacuum padding above and below slab (A)
    target_area_ang2:   200.0         # Target supercell XY area (A2). null -> minimal unit cell.
                                      # The engine selects the largest possible supercell that does NOT
                                      # exceed this value (<= target_area), while optimizing for a
                                      # square-like aspect ratio.
    supercell_matrix:   null          # Explicit supercell [[a,b],[c,d]]. Overrides target_area if set.
    top_termination:    "O"           # Element required at the top surface
    bottom_termination: "O"           # Element required at the bottom surface

  # ── Surface Reconstruction ───────────────────────────────────────────────
  # Surface atoms often rearrange to minimize surface free energy, breaking
  # the symmetry of the ideal bulk-terminated structure. This block allows
  # for the automated application of initial geometric perturbations
  # (Stage 0.5) before the main reaction search.
  reconstruction:
    enabled:  false                # Toggle for automated surface reconstruction logic.

    # Reconstruction Strategy:
    # "auto" (Recommended)
    #   The Intelligent Reconstruction Engine automatically classifies the material
    #   based on electronegativity and coordination to apply the best-fit pattern:
    #   - Covalent (e.g., Si, Ge, C): Applies Dimerization and Buckling to reduce
    #     surface energy from dangling bonds.
    #   - Ionic (e.g., Oxides, Salts): Applies Rumpling (vertical displacement where
    #     cations retract inward and anions bulge outward).
    #   - Metallic: Applies Surface Relaxation (inward layer contraction) and
    #     random noise to break electronic symmetry.
    #
    # "random_noise"
    #   Applies small random displacements to all surface atoms. This acts as a
    #   general symmetry breaker, allowing high-fidelity potentials (like MACE)
    #   to discover unknown reconstructions during subsequent relaxation stages.
    strategy: "auto"

    # Target surface for reconstruction.
    # "top"    : Reconstruct only the top (reactive) surface.
    # "bottom" : Reconstruct only the bottom surface.
    # "both"   : Reconstruct both sides (useful for symmetric thin films).
    side:     "top"

    # --- Strategy-specific Hyperparameters ---
    # Magnitude of vertical displacement (A) for buckling or rumpling patterns.
    buckling_dist: 0.4
    # Magnitude of lateral displacement (A) for dimerization (pulling pairs together).
    dimer_dist:    0.6
    # Amplitude (A) for random displacements in 'random_noise' or 'auto' metallic modes.
    amplitude:     0.1

  passivation:
    enabled:   true
    element:   "H"
    side:      "bottom"  # "top" | "bottom" | "both"
    coverage:  1.0       # Fraction of dangling bonds to saturate (0.0-1.0)

  surface_analysis:
    symprec:             0.2    # Symmetry precision for surface site equivalence (A)
    ideal_coordination:         # Expected coordination numbers for VSEPR dangling-bond detection
      Si: 4
      O:  2
      N:  3
      C:  4
      H:  1


# -----------------------------------------------------------------------------
# Stage 2 — Reaction Search
# -----------------------------------------------------------------------------
reaction_search:

  # ── Global symmetry precision ─────────────────────────────────────────────
  # Single parameter that governs ALL symmetry-reduction steps in the reaction
  # search: surface-site deduplication (AdsorptionWorkflowManager), dangling-
  # bond site equivalence (chemisorption builder), and coordinate deduplication
  # (get_unique_coordinates / generate_and_plot_site_map).
  #
  # Increase to collapse more sites and shrink the candidate set (faster but
  # may merge genuinely inequivalent sites).  Decrease for high-symmetry slabs
  # where aggressive grouping hides real binding configurations.
  #
  # Typical values:
  #   0.1 – 0.2 A   Conservative — keeps most distinct sites (recommended default)
  #   0.5 – 1.0 A   Aggressive   — strong grouping for large or near-symmetric cells
  symprec: 0.2

  # ── Geometry-only ──────────────────────────────────────────────────────────

  # ── Adsorption Mechanisms & Discovery Logic ───────────────────────────────
  # Stage-specific controls for Physisorption and Chemisorption.
  # Note: Global defaults have been removed to ensure strict independent control.
  # Each stage (inhibition/precursor) must define its own mechanism blocks.

  mechanisms:
    # [STAGE 1: INHIBITOR DISCOVERY / SURFACE FUNCTIONALIZATION]
    # This stage simulates the adsorption of inhibitors or functional molecules
    # on the clean surface BEFORE the main precursor is introduced.
    inhibitor:
      enabled:          true
      center:           "O"     # Binding atom in the molecule (Element or index)
      branching_limit:  1       # Number of top inhibited surfaces to pass to Stage 2
      
      # Search Mechanisms for Stage 1 (Inhibitor)
      physisorption:
        enabled:          true
        placement_height: 3.5   # Initial height above top surface layer (A), see height_mode
        n_rot:            8     # Fibonacci-sphere sampling orientations per site
        center:           "com" # "com", "closest", element symbol, or atom index

        # ── Height interpretation mode ──────────────────────────────────────
        # "clearance" (default)
        #   Lowest atom of the molecule is placed exactly placement_height A
        #   above the top substrate layer.  Physically correct for large
        #   molecules (e.g., DIPAS, ~8 A extent) where the COM can be far
        #   above the binding atom.  Prevents accidental embedding.
        # "center"
        #   Rotation center (COM or the element specified by `center`) is
        #   placed at placement_height A above the surface.  Use when you need
        #   a consistent center-to-surface reference across multiple molecules.
        height_mode:      "clearance"

        # ── Optional gravity pull ────────────────────────────────────────────
        # After initial placement, descend the molecule step_size A per step
        # until the first Alvarez vdW contact (overlap_scale × (r_i + r_j)) or
        # the hard floor (substrate surface + 0.3 A) is reached.
        # Disabled by default; useful for compact molecules or tight cavities.
        gravity_pull:
          enabled:    false
          step_size:  0.2       # A per descent step

      chemisorption:
        enabled:          true
        byproduct_placement: "vacuum"  # Options: "vacuum" (suspended far above surface), "surface" (physisorbed adjacent to reaction site)
        rot_steps:        8     # Rotation attempts for bond-alignment
        
        # ── Coordination Analysis ───────────────────────────────────────────
        # Parameters for identifying dangling bonds and exchange sites.
        coordination_analysis:
          bond_slack: 0.2        # Slack added to covalent radii sum (A).
                                 # 0.2 is recommended for TiN/Oxides to avoid
                                 # counting 2nd neighbors as bonds.
          max_neighbor_dist: 4.0 # Search radius for initial neighbor detection (A).
          z_surface_threshold: 3.5 # Distance from z_sub_max to consider substrate atoms as surface (A).
                                   # Set larger (e.g. 3.5) for buckled surfaces to avoid skipping depressed atoms.

        proximity_filter:
          enabled:   false      # false -> check all sites | true -> check only near inhibitors
          cutoff:    7.0        # A, max distance from any inhibitor atom to site
          visualize: true       # true -> generate site_proximity_map.png in results dir

    # [STAGE 2: MAIN PRECURSOR DISCOVERY]
    # This stage simulates the adsorption of the target ALD/CVD precursor
    # on the surfaces selected from Stage 1.
    precursor:
      center:           ["Si", "Ti", "Al", "Fe"]    # Central reactive atom. Supports:
                                                    # - Single element ("Si")
                                                    # - List of elements (autodetects first match in molecule)
                                                    # - "com" (Center of Mass)
                                                    # - null (autodetects metal/semiconductor)

      # Search Mechanisms for Stage 2 (Main Precursor)
      physisorption:
        enabled:          true
        placement_height: 3.5
        n_rot:            8     # Fibonacci-sphere sampling orientations per site
        center:           "com"

        # ── Height interpretation mode (same semantics as inhibitor block above)
        height_mode:      "clearance"

        # ── Optional gravity pull ────────────────────────────────────────────
        gravity_pull:
          enabled:    false
          step_size:  0.2       # A per descent step

      chemisorption:
        enabled:          true
        byproduct_placement: "vacuum"  # Options: "vacuum" (suspended far above surface), "surface" (physisorbed adjacent to reaction site)
        rot_steps:        8
        
        # ── Coordination Analysis ───────────────────────────────────────────
        coordination_analysis:
          bond_slack: 0.2
          max_neighbor_dist: 4.0
          z_surface_threshold: 3.5

        proximity_filter:
          enabled:   true       # Recommended for inhibited surfaces
          cutoff:    7.0        # A
          visualize: true       # Generate proximity map visualization

      # [STAGE 2.5: TRANSITION STATE DISCOVERY]
      # Connects physisorption and chemisorption states via NEB and ARTn refinement.
      # Features automated PBC alignment and vibrational saddle-point verification.
      ts_search:
        enabled:          true

        # ── Advanced TS Logic ───────────────────────────────────────────────
        # mapping_mode: true (default)
        #   true  -> run the Hungarian algorithm (geometric matching) to map atom
        #            indices between the initial/final states. Robust when the two
        #            states are built independently and atom ordering may differ;
        #            enforces element-count consistency under PBC.
        #   false -> skip Hungarian matching and assume the two states already
        #            share an identical atom ordering (identity mapping). Cheaper,
        #            and avoids any risk of mismatched pairing when ordering is
        #            already known to be consistent (e.g. same builder).
        #
        # verification: true (default)
        #   Automatically runs vibrational analysis after TS refinement to
        #   confirm exactly one imaginary frequency (saddle point).
        mapping_mode:     true
        verification:     true

        # ── NEB (Nudged Elastic Band) ────────────────────────────────────────
        neb:
          n_images:       7       # Number of movable intermediate images (endpoints excluded).
                                  # More images → smoother path but proportionally more cost.
                                  # Typical: 5–9. For flat/barrierless surfaces, 3–5 is enough.

          fmax:           0.05    # Force convergence criterion (eV/Å).
                                  # Applied to the NEB spring-projected forces.
                                  # 0.05 eV/Å is standard; tighten to 0.03 for accurate barriers.

          steps:          100     # Max FIRE optimizer steps.
                                  # NEB cost ≈ steps × n_images × single-point time.
                                  # 100 steps is usually sufficient when IDPP initialises well;
                                  # raise to 200 for difficult paths (large barriers, many images).

          interpolate:    "idpp"  # Initial path interpolation method.
                                  # "idpp"   Image-Dependent Pair Potential — minimises
                                  #          artificial bond stretching along the path.
                                  #          Strongly recommended for molecular adsorbates.
                                  # "linear" Simple Cartesian linear interpolation.
                                  #          Fast but can pass through high-energy regions;
                                  #          use only as a fallback.

          climbing_image: false   # Climbing Image NEB (CI-NEB).
                                  # false (default) — standard NEB; all images feel spring forces.
                                  # true — the highest-energy image climbs toward the saddle
                                  #        point without spring forces, giving a more accurate
                                  #        barrier. Recommended after an initial NEB run converges
                                  #        and you want to sharpen the TS estimate.
                                  # Note: CI-NEB can diverge if the initial path is far from
                                  #       the saddle; run plain NEB first.

        # ── ARTn (Activation-Relaxation Technique) ───────────────────────────
        artn:
          fmax:           0.05    # Force convergence criterion (eV/Å) for ARTn FIRE optimizer.

          steps:          200     # Max FIRE optimizer steps for ARTn saddle search.
                                  # ARTn evaluates 1 image at a time, so each step is cheap
                                  # (~single-point time). 200 is a safe default.

          displacement_ang: 0.1   # Initial displacement magnitude (Å) along the softest mode.
                                  # Larger values escape shallow local minima faster but may
                                  # overshoot the saddle region.
                                  # Typical range: 0.05 – 0.3 Å.


    # [SPECIAL MECHANISM: PROTECTOR EXCHANGE]
    # Simulates exchange reactions within established protector layers.
    protector_exchange:
      enabled:         false
      reactive_leaves: []       # e.g. ["CH3", "H"]
      cavity_grid_ang: 0.2      # Resolution for void-center search (A)

  candidate_filter:
    # ── Overlap criterion — Alvarez (2013) vdW radii ─────────────────────────
    # Steric clash is detected when the inter-atomic distance falls below:
    #
    #   d_threshold(i, j) = overlap_scale × (r_vdW,i + r_vdW,j)
    #
    # where r_vdW values are taken from the Alvarez (2013) database
    # (Dalton Trans. 42, 8617-8636, DOI: 10.1039/c3dt50599e).
    # This element-aware criterion automatically accounts for the different
    # spatial extents of H (1.20 A), Si (2.19 A), N (1.66 A), etc.,
    # replacing the previous single-value `overlap_cutoff` distance.
    #
    # overlap_scale guidelines:
    #   0.55 — very permissive: only hard core repulsion rejected
    #   0.65 — recommended default: rejects genuine clashes while allowing
    #           all valid physisorption starting geometries
    #   0.75 — strict: tighter exclusion; may reject valid poses for small
    #           molecules with compact geometries
    #
    # For chemisorption geometry checks, an explicit flat cutoff (e.g.,
    # cutoff=1.4 A) can still be passed directly to check_overlap(); it
    # overrides the vdW-based threshold for that call only.
    overlap_scale:  0.65

    max_pair_dist:  5.0    # Max distance between two dangling-bond sites to form a reaction pair (A)

  # ── Potential-required ─────────────────────────────────────────────────────

  # [Candidate Verification & Sampling]
  # Whether each stage runs is controlled by the top-level `workflow` block.
  # Parameters (fmax, steps, frozen_z_ang) come from the top-level `relaxation`
  # and `equilibration` blocks.  Only the selection filter below is specific to
  # the verification step.
  verification:
    # ── Selection Filter ────────────────────────────────────────────────────
    # List of specific candidate indices to process (e.g. [0, 12, 45]).
    # If a string is provided, it is evaluated as a Python expression.
    # e.g., "list(range(10)) + [20, 30]" or "np.arange(0, 100, 5)"
    # If null, all candidates are processed.
    selected_indices: null


# -----------------------------------------------------------------------------
# Stage 3 — Analysis
# -----------------------------------------------------------------------------
analysis:

  # ── Potential-required ─────────────────────────────────────────────────────

  vibrational:                   # [REQUIRES POTENTIAL]
    displacement_ang:  0.01      # Finite-difference step for Hessian construction (A).

    # --- PHVA / FHVA scope control -------------------------------------------
    # phva.enabled: false  →  FHVA: Full Hessian, all atoms displaced (expensive).
    # phva.enabled: true   →  PHVA: Partial Hessian; atom selection via sub-options.
    #
    # Sub-options (only active when enabled: true):
    #   frozen_z_ang  Exclude atoms whose z < z_min(atoms) + this value (A).
    #                 Prevents spurious imaginary modes from artificially frozen
    #                 bottom layers.  null → no height filtering.
    #
    #   radius_ang    Further restrict to adsorbate atoms + all neighbours within
    #                 this radius (A).  Requires adsorbate identification via
    #                 tags / protector-species.  null → no radius restriction.
    #
    #   center        Focal atom(s) for the radius_ang sphere.
    #                 null / "adsorbate" → all adsorbate atoms (union of spheres).
    #                 element symbol    → adsorbate atoms of that element, e.g. "Si".
    #                 integer           → one specific atom by absolute index.
    #                 "com"             → adsorbate center-of-mass.
    phva:
      enabled:      true
      frozen_z_ang: 3.0          # Exclude bottom slab layers (A).
      radius_ang:   6.0          # Neighbourhood radius around focal atom(s) (A).
      center:       "Si"         # e.g. central reactive atom of the precursor.
    
    # --- Cache format --------------------------------------------------------
    # cache_format: null (default) | "lammps_dump"
    #
    #   null  (default)
    #     Uses ASE Vibrations' built-in JSON cache.  Each displaced configuration
    #     is stored as a small JSON file in the *name* directory and deleted
    #     (or kept, see save_cache) after the run.
    #
    #   "lammps_dump"
    #     Runs a custom finite-difference loop. Every displaced configuration
    #     is saved in a subdirectory as a LAMMPS custom dump file:
    #       {name}/0/force.dump              — undisplaced reference
    #       {name}/{i}/force.dump            — i-th displacement (i = 1, 2, ...)
    #       {name}/types.map                 — integer type → element mapping
    #       {name}/disp_manifest.txt         — mapping of index i to atom/direction
    #     Columns in force.dump: id  type  x  y  z  fx  fy  fz
    #     Positions in Å; forces in eV/Å (ASE native).
    #     Both orthogonal and triclinic cells are supported.
    #
    #     These files can be fed directly to phonolammps or a custom phonopy
    #     workflow to compute force constants independently for comparison.
    #
    #     Fast restart: if overwrite is false and a dump file already exists it
    #     is reused without a new MLIP evaluation.
    cache_format:      null

    # save_cache: false (default) | true
    #   false -> delete the cache directory after analysis (original behaviour).
    #   true  -> preserve the cache directory for post-processing.
    #            Particularly useful with cache_format: "lammps_dump" to keep
    #            the dump files for phonopy comparison.
    save_cache:        false

    # overwrite: true | false (default: true)
    # true  -> Re-calculate all displacements (deletes existing cache).
    # false -> Resume from existing cache if available (fast restart).
    overwrite:         true

    # phonopy-compatible output:
    # null -> Automatically writes "qpoints.yaml" to the result directory.
    # "path/to/f.yaml" -> Use specific file for following steps.
    qpoints_file:      null

    mode_refinement:             # [REQUIRES POTENTIAL]
      # Advanced stability refinement using linear combination of imaginary modes.
      enabled:            true
      max_iter:           10
      freq_threshold_thz: -0.1   # Follow modes with frequency below this value (THz).
      max_modes:          3      # Max simultaneous modes to follow.
      perturbation_alpha: 0.1    # Displacement magnitude along eigenvector (A).
      max_displacement:   0.3    # Per-atom displacement safety cap (A).
      
      # Tighter relaxation than engine.relaxation — explicitly overridden here:
      fmax:  0.005               # eV/A. High precision required for mode following.
      steps: 500

    visualization:
      # Generate animation frames (extxyz) for the relaxation pathway.
      enabled:    true
      n_frames:   10
      output_traj: "relaxation.extxyz"

  # ── No potential required ──────────────────────────────────────────────────

  thermochemistry:
    # Calculation of Gibbs free energies and ZPE.
    temperatures_K: [298.15, 400.0, 500.0, 600.0, 700.0, 800.0, 900.0, 1000.0]

    gas:
      # Auto-derived via spglib point-group analysis from paths.precursor.
      mass:    null
      moments: null
      sigma:   null

    adsorbent:
      # Reference electronic energy (eV), usually from MLIP single-point.
      electronic_energy: 0.0

  # ───────────────────────────────────────────────────────────────────────────
  # [METADYNAMICS]  PLUMED-free, ASE-native (well-tempered) metadynamics.
  # ───────────────────────────────────────────────────────────────────────────
  # Biases a set of collective variables (CVs) to reconstruct a 2D free-energy
  # surface (FES) of the precursor surface reaction. No external PLUMED install
  # is required — the bias is added as an ASE calculator.
  #
  # Outputs (under <results>/metad/):
  #   COLVAR            time series of CVs + bias energy
  #   HILLS             deposited Gaussians
  #   metad_traj.extxyz MD trajectory
  #   fes_2d.npz        reconstructed 2D FES grid (x, y, fes)
  #   fes_2d.png        2D FES contour plot
  metadynamics:                    # [REQUIRES POTENTIAL]
    enabled:           false

    # ── MD / deposition parameters ──────────────────────────────────────────
    temperature_K:     500.0       # Langevin thermostat temperature.
    timestep_fs:       1.0         # MD timestep (fs).
    friction:          0.01        # Langevin friction (1/fs-ish, ASE units).
    steps:             20000       # Total MD steps.
    deposition_stride: 50          # Deposit one Gaussian every N steps.
    colvar_stride:     50          # Write COLVAR / trajectory every N steps.
    height:            0.05        # Initial Gaussian height h0 (eV).
    bias_factor:       10          # Well-tempered factor γ (>1). null → standard metaD.

    # Optional: freeze substrate atoms below this absolute z (Å). null → none.
    freeze_below_z:    null

    # ── Collective variables ────────────────────────────────────────────────
    # Define ≥2 CVs; the 2D FES is plotted over the pair named in `plot.cvs`
    # (extra CVs are biased too and marginalised out of the 2D plot).
    #
    # Atom selection accepts:
    #   42                  → atom index 42
    #   "Si"                → all Si atoms
    #   "O@substrate"       → O atoms with tag < 2 (slab)
    #   "N@adsorbate"       → N atoms with tag ≥ 2 (precursor)
    #   [3, 7, 11]          → explicit group
    #
    # CV types:
    #   distance        raw bond length between `center` and `partner` (one bond).
    #                   Use for the forming central-atom ↔ substrate bond so it
    #                   can be driven shorter. (set grid_min/grid_max as a wall-
    #                   like plotting range; add freeze if fragments fly off).
    #   coordination    rational-switching coordination number of `center` to a
    #                   `group` (needs `r0`, optional n/m). Permutation-invariant
    #                   and bounded — robust for the breaking bond when several
    #                   equivalent ligand atoms exist (e.g. 4× Cl of TiCl4).
    #   proton_transfer ξ = d(donor–H) − d(acceptor–H). Drives the H from the
    #                   surface `donor` onto the leaving-ligand `acceptor`,
    #                   inducing the byproduct (HCl, amine-H) bond.
    cvs:
      - name:    forming_bond          # central atom approaching the substrate
        type:    distance
        center:  "Si@adsorbate"
        partner: "O@substrate"
        sigma:   0.10
        grid_min: 1.4
        grid_max: 4.0

      - name:    breaking_bond         # central atom ↔ leaving ligand
        type:    coordination
        center:  "Si@adsorbate"
        group:   "N@adsorbate"
        r0:      2.2
        n:       6
        m:       12
        sigma:   0.10

      # Optional 3rd CV — proton transfer that forms the ligand-H byproduct.
      # - name:     proton_transfer
      #   type:     proton_transfer
      #   donor:    "O@substrate"       # surface O-H (proton source)
      #   acceptor: "N@adsorbate"       # leaving amine N (proton sink)
      #   # proton:  <index>            # optional; defaults to H nearest the donor
      #   sigma:    0.10

    # ── 2D FES plot selection ───────────────────────────────────────────────
    plot:
      cvs:  ["forming_bond", "breaking_bond"]   # the two CVs spanning the FES
      bins: 120                                  # grid resolution per axis

