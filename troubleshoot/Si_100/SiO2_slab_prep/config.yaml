paths:
  substrate_bulk: "./POSCAR_SiO2.vasp"
  precursor:      null #"../../structures/AllylCpNi_relaxed.vasp"
  inhibitor:      null #"../../structures/inhibitor_relaxed.vasp"
  include_no_inhibitor: false
  output_prefix:  "results"
  restart: true

# =============================================================================
# Pipeline Control — what to compute (all flags in one place)
# =============================================================================
workflow:
  slab_relax:       true   # Geometry-optimize bare slab + inhibitor first
  candidate_relax:  false  # Set to false to quickly screen geometric candidates
  md_equilibrate:   false
  post_md_relax:    false

# =============================================================================
# Relaxation parameters — shared by all relax/MD stages
# =============================================================================
relaxation:
  fmax:         0.05    # Force convergence (eV/Å)
  steps:        500     # Max optimizer steps
  frozen_z_ang: 5.5     # Fix atoms below z_min + this height (Å)

# =============================================================================
# Surface Preparation
# =============================================================================
surface_prep:
  slab_generation:
    enabled:           true
    miller:            [0, 0, 1]
    thickness_ang:     12.0
    vacuum_ang:        15.0
    target_area_ang2:  250.0
    top_termination:    "O"           # Element required at the top surface
    bottom_termination: "O"           # Element required at the bottom surface

  passivation:
    enabled: true
    element: "H"
    side:    "bottom"
    coverage:  1.0       # Fraction of dangling bonds to saturate (0.0-1.0)

  surface_analysis:
    symprec:             0.2    # Symmetry precision for surface site equivalence (A)
    ideal_coordination:         # Expected coordination numbers for VSEPR dangling-bond detection
      Si: 4
      O:  2
      N:  3
      C:  4
      H:  1

# =============================================================================
# Simulation Engine
# =============================================================================
engine:
  potential:
    backend: "sevennet"
    model:   "omni"
    modal:   "matpes_pbe"
    device:  "cpu"
