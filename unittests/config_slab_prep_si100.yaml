# Si(100) 2x1 buckled-dimer reconstruction + bottom H passivation
# ----------------------------------------------------------------
# MLIP 없이 geometry 단계만 실행 (slab_relax: false, candidate_relax: false)
#
# bulk_shift=0.25 주의사항 (surface_utils.py 수정됨)
# ---------------------------------------------------
# ASE surface(vacuum=0) 는 cell_c = z_max 로 설정해 최상단 원자가 분수 좌표 1.0 == 0.0
# (PBC). bulk_shift=0.25 적용 시 z=0 과 z=cell_c 원자가 합쳐져 16-원자 이중층이 생겼음.
# create_slab_from_bulk 에서 적용 전 cell_c = num_layers * d_hkl 로 보정 (수정됨).
# 수정 후: bottom Si coord=2 (dangling 2개) → H passivation 정상 동작.
#
# ideal_coordination 미지정 → chem_data.json 기본값 자동 적용 (Si=4, O=2, H=1 등)

paths:
  substrate_bulk: "../structures/Si_mp149.vasp"  # 8-atom conventional cubic Si (a=5.444 A)
  output_prefix:  "output_slab_prep/si100"        # unittests/ 기준 상대경로
  precursor: null
  inhibitor: null

workflow:
  slab_relax:      false
  candidate_relax: false
  md_equilibrate:  false
  post_md_relax:   false

relaxation:
  fmax:         0.05
  steps:        100
  frozen_z_ang: 5.5

surface_prep:
  slab_generation:
    enabled:          true
    miller:           [1, 0, 0]
    thickness_ang:    8.0
    vacuum_ang:       10.0
    bulk_shift:       0.25
    supercell_matrix: [[2, 0], [0, 2]]

  reconstruction:
    enabled:       true
    strategy:      "auto"         # Si + miller(1,0,0) -> reconstruct_si100_2x1_buckled
    side:          "top"
    buckling_dist: 0.4

  passivation:
    enabled:  true
    element:  "H"
    side:     "bottom"
    coverage: 1.0

  # ideal_coordination 생략 → chem_data.json 기본값 자동 적용
  # 비표준 원소나 비표준 환경에서만 명시:
  # surface_analysis:
  #   ideal_coordination:
  #     Si: 4
