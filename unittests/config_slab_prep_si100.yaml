# Si(100) 2x1 buckled-dimer reconstruction + bottom H passivation
# ---------------------------------------------------------------
# MLIP 없이 geometry 단계만 실행 (slab_relax: false, candidate_relax: false)
# bulk_shift=0.25: Si(100) bilayer 경계를 노출해 2x1 재구성에 필요한 dimer 쌍 확보
# bond_slack=0.45: MLIP 릴랙스 후 dimer 결합 ~2.46 A 인식에 필요
#   (default 0.20 -> cutoff 2.42 A < 2.46 A -> dimer 불인식 -> dangling bond 2개 오류)

paths:
  substrate_bulk: "fixtures/bulk_si.vasp"   # load_yaml_config 이 config 위치 기준으로 절대경로 변환
  output_prefix:  "test_output/si100"       # 테스트 코드에서 tmpdir 로 덮어씀
  precursor: null
  inhibitor: null

workflow:
  slab_relax:      false   # MLIP 없음 — geometry 검증만
  candidate_relax: false
  md_equilibrate:  false
  post_md_relax:   false

relaxation:
  fmax:         0.05
  steps:        100
  frozen_z_ang: 5.5

surface_prep:
  slab_generation:
    enabled:          true
    miller:           [1, 0, 0]
    thickness_ang:    8.0
    vacuum_ang:       10.0
    bulk_shift:       0.25        # bilayer 경계 노출 — 2x1 재구성 필수
    supercell_matrix: [[2, 0], [0, 2]]

  reconstruction:
    enabled:       true
    strategy:      "auto"         # Si + miller(1,0,0) -> reconstruct_si100_2x1_buckled
    side:          "top"
    buckling_dist: 0.4            # 수직 버클링 진폭 (A)

  passivation:
    enabled:  false
    # Si(100) bottom passivation 은 이 셀 기하에서 PBC 아티팩트로 동작하지 않음.
    # bulk_shift=0.25 + 2x2 supercell 조합에서 최하단 Si 원자가 제2층 Si 6개와
    # 모두 동일 거리(2.352 A)에 위치 → filter_bonded_neighbor_vectors 가 결합 6개
    # 감지 (예상 2개) → num_missing < 0 → H 미배치.
    # Si(100) 관련 핵심 테스트는 2x1 dimer 재구성이므로 passivation 은 비활성화.
    element:  "H"
    side:     "bottom"
    coverage: 1.0

  surface_analysis:
    ideal_coordination:
      Si: 4
      H:  1
