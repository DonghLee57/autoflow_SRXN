# SiO2(001) O-terminated top+bottom + bottom H passivation
# ---------------------------------------------------------
# MLIP 없이 geometry 단계만 실행 (slab_relax: false, candidate_relax: false)
# top_termination/bottom_termination: create_slab_from_bulk 에 전달되어야
#   O-terminated slab 이 생성됨 (누락 시 Si-terminated 기본 컷 적용)
# passivation side=bottom: bottom O-H 형성, top O dangling bonds 는
#   chemisorption active sites 로 보존
#
# ideal_coordination 미지정 → chem_data.json 기본값 자동 적용 (Si=4, O=2, H=1)

paths:
  substrate_bulk: "../structures/SiO2_mp-546794.vasp"  # tetragonal SiO2 (4Si+8O, MP ID 546794)
  output_prefix:  "output_slab_prep/sio2"               # unittests/ 기준 상대경로
  precursor: null
  inhibitor: null

workflow:
  slab_relax:      false
  candidate_relax: false
  md_equilibrate:  false
  post_md_relax:   false

relaxation:
  fmax:         0.05
  steps:        100
  frozen_z_ang: 5.5

surface_prep:
  slab_generation:
    enabled:            true
    miller:             [0, 0, 1]
    thickness_ang:      12.0
    vacuum_ang:         15.0
    target_area_ang2:   250.0
    top_termination:    "O"
    bottom_termination: "O"

  passivation:
    enabled:  true
    element:  "H"
    side:     "bottom"
    coverage: 1.0

  # ideal_coordination 생략 → chem_data.json 기본값 자동 적용 (Si=4, O=2, H=1)
  # surface_analysis:
  #   ideal_coordination:
  #     Si: 4
  #     O:  2
  #     H:  1
