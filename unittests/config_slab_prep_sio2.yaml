# SiO2(001) O-terminated top+bottom + bottom H passivation
# ---------------------------------------------------------
# MLIP 없이 geometry 단계만 실행 (slab_relax: false, candidate_relax: false)
# top_termination/bottom_termination: create_slab_from_bulk 에 전달되어야
#   O-terminated slab 이 생성됨 (누락 시 Si-terminated 기본 컷 적용)
# passivation side=bottom: bottom O-H 형성, top O dangling bonds 는
#   chemisorption active sites 로 보존

paths:
  substrate_bulk: "../troubleshoot/SiO2_slab_prep/POSCAR_SiO2.vasp"
  output_prefix:  "test_output/sio2"   # 테스트 코드에서 tmpdir 로 덮어씀
  precursor: null
  inhibitor: null

workflow:
  slab_relax:      false   # MLIP 없음 — geometry 검증만
  candidate_relax: false
  md_equilibrate:  false
  post_md_relax:   false

relaxation:
  fmax:         0.05
  steps:        100
  frozen_z_ang: 5.5

surface_prep:
  slab_generation:
    enabled:            true
    miller:             [0, 0, 1]
    thickness_ang:      12.0
    vacuum_ang:         15.0
    target_area_ang2:   250.0
    top_termination:    "O"    # O-terminated 상단 (chemisorption active sites)
    bottom_termination: "O"    # O-terminated 하단 (passivation 대상)

  passivation:
    enabled:  true
    element:  "H"
    side:     "bottom"   # bottom O-H 형성, top O dangling 유지
    coverage: 1.0

  surface_analysis:
    ideal_coordination:
      Si: 4
      O:  2
      H:  1
