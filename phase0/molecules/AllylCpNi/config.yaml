paths:
  input_structure:  "../../../structures/AllylCpNi.vasp"
  center_in_vacuum: true
  output_prefix:    "results/AllylCpNi"

engine:
  potential:
    backend: "sevennet"
    model:   "7net-0"
    device:  "cpu"
    dtype:   "float32"

  relaxation:
    optimizer: "FIRE"
    fmax:      0.005
    steps:     500

analysis:
  vibrational:
    name:             "results/vib"
    displacement_ang: 0.005
    phva:
      enabled: false

    mode_refinement:
      enabled:            true
      max_iter:           6
      fmax:               0.005
      steps:              500
      freq_threshold_thz: -0.1
      max_modes:          3
      perturbation_alpha: 0.4
      stagnation_factor:  0.5
      stagnation_epsilon: 0.05
